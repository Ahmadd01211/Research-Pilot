name: researchpilot_greenfield
x-backend: &backend
  image: researchpilot-greenfield-backend:dev
  build: ./backend
  environment: &environment
    RP_DATABASE_URL: postgresql+psycopg://rp:${POSTGRES_PASSWORD:?Create .env from .env.example}@db:5432/rp_greenfield
    RP_REDIS_URL: redis://redis:6379/0
    RP_PUBLIC_ORIGIN: http://localhost:3100
    RP_ENVIRONMENT: development
    RP_EMBEDDING_ENABLED: ${RP_EMBEDDING_ENABLED:-false}
    RP_EMBEDDING_PROVIDER: ${RP_EMBEDDING_PROVIDER:-google}
    RP_EMBEDDING_URL: http://embedder:8000
    RP_ANSWER_ENABLED: ${RP_ANSWER_ENABLED:-false}
    RP_ANSWER_PROVIDER: ${RP_ANSWER_PROVIDER:-google}
    RP_ANSWER_MODEL: ${RP_ANSWER_MODEL:-gemini-3.8-flash}
    RP_ANSWER_DAILY_LIMIT: ${RP_ANSWER_DAILY_LIMIT:-20}
    RP_ANSWER_USER_DAILY_LIMIT: ${RP_ANSWER_USER_DAILY_LIMIT:-}
    RP_OPENROUTER_ALLOW_DATA_COLLECTION: ${RP_OPENROUTER_ALLOW_DATA_COLLECTION:-false}
    RP_GOOGLE_API_KEY: ${RP_GOOGLE_API_KEY:-}
    RP_OPENROUTER_API_KEY: ${RP_OPENROUTER_API_KEY:-}
  init: true
  security_opt: [no-new-privileges:true]
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rp
      POSTGRES_DB: rp_greenfield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U rp -d rp_greenfield']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *backend
    ports: ['127.0.0.1:8100:8000']
    volumes: [papers:/var/lib/researchpilot]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v1/health/ready", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 12
  dispatcher:
    <<: *backend
    command: [python, -m, app.workers.dispatcher]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -m, app.workers.dispatcher_health]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *backend
    volumes: [papers:/var/lib/researchpilot:ro]
    command: [celery, -A, app.workers.celery_app:celery_app, worker, -Q, 'documents,embeddings,analysis,exports', --concurrency=2, --loglevel=WARNING]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.workers.celery_app:celery_app inspect ping --destination "celery@$${HOSTNAME}" --timeout 3']
      interval: 30s
      timeout: 10s
      retries: 5
  # Local Qwen3 embeddings. Enable with COMPOSE_PROFILES=local-embeddings and
  # RP_EMBEDDING_PROVIDER=local. No published port: only api and worker reach it.
  embedder:
    profiles: [local-embeddings]
    image: researchpilot-greenfield-embedder:dev
    build: {context: ./backend, dockerfile: Dockerfile.embedder}
    environment:
      EMBEDDER_THREADS: ${RP_EMBEDDER_THREADS:-4}
    # Weights persist here across rebuilds; only a new pinned revision downloads again.
    volumes: [embedder-models:/models]
    init: true
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: ${RP_EMBEDDER_MEMORY:-4g}
    # Self-heal if a future input pattern ever exhausts memory; jobs retry meanwhile.
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=3)']
      interval: 15s
      timeout: 5s
      retries: 5
      # First start downloads about 1.2 GB into the volume.
      start_period: 900s
  web:
    build: ./frontend
    ports: ['127.0.0.1:3100:8080']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/login || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  embedder-models:
  papers:
  postgres:
  redis:
