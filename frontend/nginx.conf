server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 256k;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Docker may assign the API a new address when its container is recreated.
    # Resolve the service name at request time instead of caching its startup IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend api:8000;
    # Larger body cap applies only to the document collection upload route.
    location ~ ^/api/v1/projects/[0-9a-fA-F-]+/documents$ {
        client_max_body_size 20m;
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location /api/v1/ {
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
    location ~ ^/assets/[a-zA-Z0-9._-]+\.mjs$ {
        types { text/javascript mjs; }
        default_type text/javascript;
        try_files $uri =404;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
